name: PMP check

on:
  schedule:
    - cron: "5 13 * * *"   
  workflow_dispatch: {}
  
jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
    
      - name: Run PMP check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MY_POSTCODE: ${{ secrets.MY_POSTCODE }}
          PMP_POSTCODE: ${{ secrets.PMP_POSTCODE }}
          PMP_EMAIL: ${{ secrets.PMP_EMAIL }}
        run: python check_pmp.py

  trigger-debug-on-failure:
    needs: main
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger debug workflow
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'debug.yml',
              ref: context.ref
            });
