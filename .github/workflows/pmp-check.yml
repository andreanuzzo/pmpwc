name: PMP daily check

on:
  schedule:
    - cron: "5 11 * * *"   # 12:05 UK during BST
    - cron: "5 12 * * *"   # 12:05 UK during GMT
  workflow_dispatch: {}

concurrency:
  group: pmp-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run PMP check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MY_POSTCODE: ${{ secrets.MY_POSTCODE }}
          PMP_POSTCODE: ${{ secrets.PMP_POSTCODE }}
          PMP_EMAIL: ${{ secrets.PMP_EMAIL }}
        run: python check_pmp.py
